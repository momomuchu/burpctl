[project]
name = "bp"
version = "2.1.0"
description = "bp — drive Burp Suite from the command line (talks to the burp-rest-extension on :8089)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.26.0",
    "pydantic>=2.7",
]

[project.scripts]
bp = "bp.cli:cli_main"
burpctl = "bp.cli:cli_main"

[dependency-groups]
dev = [
    "build>=1.2",
    "hypothesis>=6.112",
    "mypy>=1.10",
    "openapi-spec-validator>=0.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bp"]

[tool.coverage.report]
show_missing = true
